name: smoke
description: Minutes-long end-to-end check of the harness. Not for reporting.
model_config_path: configs/models/qwen2.5-1.5b-instruct-bf16.yaml
game_config_path: configs/game/default.yaml

server:
  port: 8000
  gpu_memory_utilization: 0.8
  max_model_len: 16384
  extra_flags: ["--enable-prefix-caching"]
  startup_timeout_s: 900

agent:
  faction_max_tokens: 160
  narrator_max_tokens: 200
  temperature: 0.7
  guided_decoding: true
  faction_priority: null
  narrator_priority: null
  narrator: sequential

run:
  faction_counts: [4, 8]
  repeats: 2
  seeds: [0, 1]
  turns: 2
  warmup_turns: 1
  server_warmup_factions: 4
  server_warmup_turns: 1
  server_warmup_seed: 1000
  request_timeout_s: 600
  metrics_interval_s: 1.0
  stall_timeout_s: 180       # no token progress with work pending => abort variant

variants:
  - name: default
