[project]
name = "speculative-statecraft"
version = "0.1.0"
description = "LLM-driven grand strategy simulation as an inference-optimization workload for vLLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false
default-groups = ["dev", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
