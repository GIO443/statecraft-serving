[project]
name = "statecraft-serving"
version = "0.1.0"
description = "LLM-driven grand strategy simulation as a vLLM serving benchmark on one 8 GB GPU"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed editable by speculative-statecraft; bench.config.REPO_ROOT resolves configs/ and
# docker-compose.yml relative to this checkout, so a non-editable install is not supported.
[tool.hatch.build.targets.wheel]
packages = ["sim", "bench", "analysis"]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
